apiVersion: 1

datasources:
  - name: Postgres
    type: postgres
    uid: lankaflood-postgres
    access: proxy
    url: postgres:5432
    user: $POSTGRES_USER
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $POSTGRES_PASSWORD
    isDefault: true

  - name: Prometheus
    type: prometheus
    uid: lankaflood-prometheus
    access: proxy
    url: http://prometheus:9090
